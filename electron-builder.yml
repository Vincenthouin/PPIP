appId: com.somfy.ppip
productName: PPIP
copyright: Copyright © 2026 Somfy

# Files included in the packaged app. Vite output + the Electron entry point.
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"

# Where electron-builder writes the .dmg / .app / pack output.
directories:
  output: release

afterPack: electron/after-pack.cjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Ad-hoc signing (identity "-") so macOS Gatekeeper shows the regular
  # "unidentified developer" warning instead of refusing with "damaged".
  # No Apple Developer cert needed. Replace with a real identity + notarize
  # later for a frictionless install.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  # Tell macOS this isn't a Mac App Store build.
  type: distribution

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.dmg
